<div class="card" id="card-debordement" style="border: 1px solid var(--accent-red);">
    <h2>⚠️ Risque de Débordement de la Rétention (Cuvette)</h2>
    <div class="form-inline-2">
        <div class="form-group">
            <label>Capacité Max de la Rétention (L)</label>
            <input type="number" id="deb-Vcuvette" value="100000" oninput="calculerTout()">
        </div>
        <div class="form-group">
            <label>Capacité Totale Cuve Sinistrée (L)</label>
            <input type="number" id="deb-Vcuve-max" value="100000" oninput="calculerTout()">
        </div>
    </div>
    <div class="form-inline-3">
        <div class="form-group">
            <label>% Remplissage Cuve</label>
            <input type="number" id="deb-pct-cuve" value="80" min="0" max="100" oninput="calculerTout()">
        </div>
        <div class="form-group">
            <label>Vol. déjà en Rétention (L)</label>
            <input type="number" id="deb-Vdeverse" value="15000" oninput="calculerTout()">
        </div>
        <div class="form-group">
            <label>Débit de Fuite (L/min)</label>
            <input type="number" id="deb-Qfuite" value="400" oninput="calculerTout()">
        </div>
    </div>
    <div id="alert-debordement" class="alert-box">--</div>
</div>
